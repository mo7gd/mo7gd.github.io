<style>
:root{color-scheme:dark;--bg:#100a22;--sf:#1b1238;--sf2:#271a4d;--pk:#ff3d8b;--cy:#35e0ff;--tx:#f4efff;--mu:#9d90c9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(700px 450px at 90% -5%,#ff3d8b40,transparent),radial-gradient(600px 450px at 0% 100%,#35e0ff2e,transparent),var(--bg);color:var(--tx);font-family:"Tajawal","Cairo","Segoe UI",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{padding:64px 0 36px}
header p.hi{color:var(--cy);margin:0 0 6px;font-weight:700}
h1{font-size:clamp(34px,8vw,58px);line-height:1.15;margin:0 0 14px;font-weight:900}
h1 b{color:var(--pk);text-shadow:0 0 26px #ff3d8bbb}
header p.lead{color:var(--mu);font-size:18px;max-width:520px;margin:0}
h2{font-size:24px;margin:44px 0 16px}
.apps{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.app{background:var(--sf);border:1px solid #ffffff14;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.app .ic{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pk),#b43dff);display:grid;place-items:center;font-size:34px;box-shadow:0 8px 24px #ff3d8b55}
.app h3{margin:0;font-size:21px}
.app p{margin:0;color:var(--mu);flex:1}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--sf2);color:var(--cy)}
.dl{display:block;text-align:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--pk),#b43dff);color:#fff;font-weight:800;text-decoration:none;font-size:17px}
.dl:hover{filter:brightness(1.1)}
.soon{border-style:dashed;opacity:.7}
.soon .ic{background:var(--sf2);box-shadow:none}
.note{font-size:13px;color:var(--mu)}
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.links a{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--sf2);color:var(--tx);text-decoration:none;font-weight:700;direction:ltr;justify-content:flex-end}
.links a small{display:block;color:var(--mu);font-weight:400}
a:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
footer{padding:50px 0 40px;color:var(--mu);font-size:14px;text-align:center}
</style>

<script>
/* لإضافة تطبيق جديد: انسخ كتلة {…} وعدّل بياناتها، وارفع ملف الـ APK بجانب هذا الملف */
const APPS=[
 {icon:"🎭",name:"Anime Imposter",desc:"لعبة جماعية لكشف المخادع. يحصل الجميع على نفس شخصية الأنمي ما عدا الإمبوستر. أكثر من 320 شخصية بالعربية والإنجليزية، ومؤقت نقاش وإحصائيات.",tags:["لعبة جماعية","3 إلى 10 لاعبين","بدون إنترنت"],file:"anime-imposter.apk"},
 {icon:"✨",name:"تطبيق جديد",desc:"قريباً.",tags:["قريباً"],soon:true}
];
const box=document.getElementById('apps');
APPS.forEach(a=>{
 const d=document.createElement('article');d.className='app'+(a.soon?' soon':'');
 const ic=document.createElement('div');ic.className='ic';ic.textContent=a.icon;
 const h=document.createElement('h3');h.textContent=a.name;
 const p=document.createElement('p');p.textContent=a.desc;
 const t=document.createElement('div');t.className='tags';a.tags.forEach(x=>{const s=document.createElement('span');s.textContent=x;t.appendChild(s)});
 d.append(ic,h,p,t);
 if(a.file){const l=document.createElement('a');l.className='dl';l.href=a.file;l.setAttribute('download','');l.textContent='⬇ تحميل APK';d.appendChild(l)}
 box.appendChild(d);
});
document.getElementById('y').textContent=new Date().getFullYear();
</script>
